spring.application.name=MahaSeva
server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mahaseva_db}
spring.data.mongodb.database=mahaseva_db

jwt.secret=${JWT_SECRET}
jwt.expirationMs=604800000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
